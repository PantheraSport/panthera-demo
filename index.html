  <!-- (modo ordenador) Si el móvil tiene activado «Sitio para ordenadores» en Chrome, la página se pinta a 980 px de
       ancho, ignora el viewport y la app sale encogida en una columna. No se puede corregir desde la página: se avisa

  <div id="po-aviso-escritorio" hidden role="alert">
    <b>Estás viendo la versión de ordenador</b>
    <span>Para ver la app a pantalla completa: toca el menú <b>⋮</b> de Chrome y desmarca <b>«Sitio para ordenadores»</b>. Si la tienes instalada, ábrela desde Chrome con esa opción desmarcada.</span>
    <button type="button" aria-label="Cerrar aviso">✕</button>
  </div>
  <style>
    #po-aviso-escritorio{position:fixed;left:0;right:0;top:0;z-index:99999;display:grid;grid-template-columns:1fr auto;gap:calc(6px*var(--k,1)) calc(12px*var(--k,1));
      padding:calc(14px*var(--k,1)) calc(16px*var(--k,1));background:#82B735;color:#0A0B0C;font:500 calc(14px*var(--k,1))/1.45 Inter,system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5)}
    #po-aviso-escritorio[hidden]{display:none}
    #po-aviso-escritorio > b{grid-column:1;font-size:calc(16px*var(--k,1))}
    #po-aviso-escritorio span{grid-column:1}
    #po-aviso-escritorio button{grid-column:2;grid-row:1/3;align-self:start;border:0;background:rgba(10,11,12,.12);color:#0A0B0C;border-radius:999px;

  </style>
  <script>
    (function () {
      try {
        var tactil = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
        var lado = Math.min(screen.width || 9999, screen.height || 9999);
        if (!tactil || lado >= 600 || window.innerWidth < 900) { return; }
        var k = window.innerWidth / (screen.width || lado);
        var aviso = document.getElementById('po-aviso-escritorio');
        aviso.style.setProperty('--k', String(Math.max(1, Math.min(k, 3.5))));
        aviso.hidden = false;
        aviso.querySelector('button').addEventListener('click', function () { aviso.hidden = true; });
      } catch (e) { /* sin aviso */ }
    })();
  </script>
